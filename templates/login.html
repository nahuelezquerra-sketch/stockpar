<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <title>Ingresar | StockPar</title>
</head>

<body class="bg-light">

    <main class="container min-vh-100 d-flex
                 align-items-center justify-content-center py-4">

        <div class="card border-0 shadow w-100"
             style="max-width: 440px;">

            <div class="card-header bg-dark text-white text-center py-4">
                <h1 class="h2 fw-bold mb-1">StockPar</h1>
                <p class="small mb-0">
                    Gestión de repuestos importados
                </p>
            </div>

            <div class="card-body p-4">
                <h2 class="h4 mb-2">Iniciar sesión</h2>
                <p class="text-secondary mb-4">
                    Ingresá con tu cuenta para continuar.
                </p>

                {% for mensaje in get_flashed_messages() %}
                <div class="alert alert-info" role="alert">
                    {{ mensaje }}
                </div>
                {% endfor %}

                <form method="POST"
                      action="{{ url_for('auth.login') }}">

                    <input type="hidden"
                           name="csrf_token"
                           value="{{ session['csrf_token'] }}">

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            maxlength="120"
                            autocomplete="username"
                            placeholder="nombre@ejemplo.com"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Ingresar
                    </button>
                </form>
            </div>

            <div class="card-footer bg-white text-center
                        text-secondary small py-3">
                Acceso para Administradores y Vendedores
            </div>
        </div>

    </main>
</body>
</html>
