<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <title>Editar repuesto | StockPar</title>
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a href="/" class="navbar-brand fw-bold">StockPar</a>

            <a href="{{ url_for('repuesto.listar') }}"
               class="btn btn-outline-light btn-sm">
                Volver a repuestos
            </a>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="h2 mb-1">Editar repuesto</h1>
        <p class="text-secondary mb-4">
            Código: {{ repuesto.codigo }}
        </p>

        {% for mensaje in get_flashed_messages() %}
        <div class="alert alert-info" role="status">
            {{ mensaje }}
        </div>
        {% endfor %}

        <section class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form method="POST"
                      action="{{ url_for('repuesto.editar', id_repuesto=repuesto.id_repuesto) }}">

                    <input type="hidden"
                           name="csrf_token"
                           value="{{ session['csrf_token'] }}">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="nombre" class="form-label">
                                Nombre
                            </label>
                            <input
                                class="form-control"
                                id="nombre"
                                name="nombre"
                                maxlength="120"
                                required
                                value="{{ request.form.get('nombre', repuesto.nombre) }}"
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="marca" class="form-label">
                                Marca
                            </label>
                            <input
                                class="form-control"
                                id="marca"
                                name="marca"
                                maxlength="80"
                                required
                                value="{{ request.form.get('marca', repuesto.marca) }}"
                            >
                        </div>

                        <div class="col-md-4">
                            <label for="precio_compra_usd"
                                   class="form-label">
                                Costo USD
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="precio_compra_usd"
                                name="precio_compra_usd"
                                min="0"
                                max="9999999999.99"
                                step="0.01"
                                required
                                value="{{ request.form.get('precio_compra_usd', repuesto.precio_compra_usd) }}"
                            >
                        </div>

                        <div class="col-md-4">
                            <label for="margen_ganancia"
                                   class="form-label">
                                Margen de ganancia (%)
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="margen_ganancia"
                                name="margen_ganancia"
                                min="0"
                                max="99999.99"
                                step="0.01"
                                required
                                value="{{ request.form.get('margen_ganancia', repuesto.margen_ganancia) }}"
                            >
                        </div>

                        <div class="col-md-4">
                            <label for="stock_minimo" class="form-label">
                                Stock mínimo
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="stock_minimo"
                                name="stock_minimo"
                                min="0"
                                max="2147483647"
                                step="1"
                                required
                                value="{{ request.form.get('stock_minimo', repuesto.stock_minimo) }}"
                            >
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                Guardar cambios
                            </button>

                            <a href="{{ url_for('repuesto.listar') }}"
                               class="btn btn-outline-secondary">
                                Volver sin guardar
                            </a>
                        </div>

                    </div>
                </form>

            </div>
        </section>
    </main>
</body>
</html>
